<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Sử - Địa - Công nghệ 12</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f4f6;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.header {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    padding: 25px 20px;
    border-radius: 20px;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

.header p {
    margin: 0;
}

.question {
    background: white;
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.subject {
    display: inline-block;
    background: #eef2ff;
    color: #4f46e5;
    font-size: 13px;
    font-weight: bold;
    padding: 5px 9px;
    border-radius: 20px;
    margin-bottom: 10px;
}

.question-title {
    font-weight: bold;
    font-size: 17px;
    line-height: 1.5;
    margin-bottom: 12px;
}

.option {
    display: block;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    margin: 8px 0;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #f5f5ff;
    border-color: #6366f1;
}

.option input {
    margin-right: 8px;
}

.submit {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 13px;
    background: #4f46e5;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.submit:hover {
    background: #4338ca;
}

.submit:disabled {
    cursor: not-allowed;
}

.result {
    display: none;
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-top: 20px;
}

.score {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    color: #4f46e5;
}

.result h2 {
    text-align: center;
}

.review {
    margin-top: 20px;
}

.wrong {
    background: #fff1f2;
    border-left: 4px solid #ef4444;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    line-height: 1.5;
}

.good {
    background: #ecfdf5;
    border-left: 4px solid #22c55e;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    line-height: 1.5;
}

.warning {
    background: #fff7ed;
    color: #c2410c;
    border-left: 4px solid #f97316;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
}

.retry {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.retry:hover {
    background: #000;
}

@media (max-width: 500px) {
    .header h1 {
        font-size: 21px;
    }

    .question-title {
        font-size: 16px;
    }

    .option {
        font-size: 15px;
    }
}
</style>
</head>

<body>

    <div class="header">
        <h1>📝 Ôn tập Sử - Địa - Công nghệ 12</h1>
        <p>20 câu trắc nghiệm • Chọn A, B, C hoặc D</p>
    </div>

    <div id="quiz"></div>

    <button id="submitBtn" class="submit" type="button">
        NỘP BÀI
    </button>

    <div id="result" class="result"></div>

</div>

<script>

            "Chiến tranh thế giới thứ hai bắt đầu",
            "Chủ nghĩa phát xít được khôi phục",
            "Liên hợp quốc bị giải thể"
        ],
        answer: 0
    },

    {
        subject: "Lịch sử",
        text: "Một trong những nguyên nhân dẫn tới sự sụp đổ của chế độ xã hội chủ nghĩa ở Liên Xô và Đông Âu là:",
        options: [

            "Chủ nghĩa phát xít quay trở lại"
        ],
        answer: 0
    }
];


/* ================= HIỂN THỊ CÂU HỎI ================= */

const quiz = document.getElementById("quiz");

function renderQuiz() {

    quiz.innerHTML = "";

    questions.forEach(function(q, i) {

        const box = document.createElement("div");
        box.className = "question";

        const subject = document.createElement("div");
        subject.className = "subject";
        subject.textContent = q.subject + " • Câu " + (i + 1);

        box.appendChild(subject);

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = q.text;

        box.appendChild(title);

        q.options.forEach(function(option, j) {

            const label = document.createElement("label");
            label.className = "option";

            const input = document.createElement("input");

            input.type = "radio";
            input.name = "question" + i;
            input.value = j;

            label.appendChild(input);

            const optionText = document.createTextNode(
                String.fromCharCode(65 + j) + ". " + option
            );

            label.appendChild(optionText);

            box.appendChild(label);
        });

        quiz.appendChild(box);
    });
}

renderQuiz();


/* ================= CHẤM ĐIỂM ================= */

function submitQuiz() {

    let score = 0;
    let answered = 0;
    const wrongAnswers = [];

    questions.forEach(function(q, i) {

        const selected = document.querySelector(
            'input[name="question' + i + '"]:checked'
        );

        let chosen = -1;

        if (selected) {
            chosen = Number(selected.value);
            answered++;
        }

        if (chosen === q.answer) {

            score++;

        } else {

            let chosenText = "Chưa chọn";

            if (chosen >= 0 && chosen < q.options.length) {
                chosenText =
                    String.fromCharCode(65 + chosen) +
                    ". " +
                    q.options[chosen];
            }

            const correctText =
                String.fromCharCode(65 + q.answer) +
                ". " +
                q.options[q.answer];

            wrongAnswers.push({
                number: i + 1,
                chosen: chosenText,
                correct: correctText
            });
        }
    });


    const result = document.getElementById("result");

    result.style.display = "block";

    let html = "";

    /* Cảnh báo chưa làm hết */

    if (answered < questions.length) {

        html += '<div class="warning">';
        html += "⚠️ Bạn mới trả lời " +
                answered +
                "/" +
                questions.length +
                " câu.";
        html += "</div>";
    }


    /* Điểm */

    const grade = score / 2;

    html += '<div class="score">';
    html += score + "/" + questions.length;
    html += "</div>";

    html += '<p style="text-align:center;">';
    html += "Điểm: <b>" + grade.toFixed(1) + "/10</b>";
    html += "</p>";


    /* Nhận xét */

    if (score === 20) {

        html += "<h2>🎉 Hoàn hảo!</h2>";

    } else if (score >= 18) {

        html += "<h2>🔥 Rất tốt!</h2>";

    } else if (score >= 15) {

        html += "<h2>👏 Khá tốt!</h2>";

    } else if (score >= 10) {

        html += "<h2>👍 Cần cố gắng thêm!</h2>";

    } else {

        html += "<h2>📚 Hãy ôn tập thêm nhé!</h2>";
    }


    /* Hiển thị câu sai */

    if (wrongAnswers.length === 0) {

        html += '<div class="good">';
        html += "🎉 Bạn đã trả lời đúng cả 20 câu!";
        html += "</div>";

    } else {

        html += '<div class="review">';
        html += "<h3>📌 Các câu cần xem lại</h3>";

        wrongAnswers.forEach(function(item) {

            html += '<div class="wrong">';

            html += "<b>Câu " + item.number + "</b><br>";
            html += "Bạn chọn: " + item.chosen + "<br>";
            html += "<b>Đáp án đúng: " + item.correct + "</b>";

            html += "</div>";
        });

        html += "</div>";
    }


    /* Nút làm lại */

    html += '<button class="retry" type="button" onclick="location.reload()">';
    html += "🔄 Làm lại";
    html += "</button>";

    result.innerHTML = html;


    /* Cuộn tới kết quả */

    result.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });


    /* Khóa nút nộp */

    const submitBtn = document.getElementById("submitBtn");

    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.6";
    submitBtn.textContent = "ĐÃ NỘP BÀI";
}


/* ================= NÚT NỘP BÀI ================= */

document.getElementById("submitBtn").addEventListener(
    "click",
    submitQuiz
);

</script>

</body>
</html>
